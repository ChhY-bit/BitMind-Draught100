<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .box-text { font-size: 14px; fill: #334155; }
      .small { font-size: 13px; fill: #64748b; }
      .shape-label { font-size: 13px; fill: #0f172a; font-weight: 700; }
      .board { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 8; }
      .move { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .head { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .value { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 8; }
      .output { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.8; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="760" fill="#ffffff"/>

  <text x="40" y="50" class="title">CandidateMoveNet 当前神经网络架构</text>
  <text x="40" y="78" class="subtitle">候选动作打分模型：先编码棋盘和候选动作，再为每个合法动作输出 policy logit，同时输出当前局面的 value。</text>

  <text x="70" y="130" class="section">棋盘分支 board_encoder</text>
  <rect x="50" y="155" width="210" height="92" class="board"/>
  <text x="70" y="184" class="box-title">observation</text>
  <text x="70" y="209" class="box-text">输入形状：[B, 6, 10, 10]</text>
  <text x="70" y="232" class="small">6通道棋盘状态</text>

  <line x1="260" y1="201" x2="315" y2="201" class="arrow"/>
  <rect x="315" y="132" width="250" height="138" class="board"/>
  <text x="335" y="164" class="box-title">CNN 局部特征提取</text>
  <text x="335" y="192" class="box-text">Conv2d(6,64,k=3,p=1) + ReLU</text>
  <text x="335" y="216" class="box-text">Conv2d(64,64,k=3,p=1) + ReLU</text>
  <text x="335" y="240" class="box-text">Conv2d(64,64,k=3,p=1) + ReLU</text>
  <text x="335" y="262" class="small">保持空间大小：10 x 10</text>

  <line x1="565" y1="201" x2="620" y2="201" class="arrow"/>
  <rect x="620" y="155" width="190" height="92" class="board"/>
  <text x="640" y="184" class="box-title">Flatten</text>
  <text x="640" y="209" class="box-text">64 x 10 x 10</text>
  <text x="640" y="232" class="small">展平为 6400 维</text>

  <line x1="810" y1="201" x2="865" y2="201" class="arrow"/>
  <rect x="865" y="155" width="210" height="92" class="board"/>
  <text x="885" y="184" class="box-title">Linear + ReLU</text>
  <text x="885" y="209" class="box-text">Linear(6400, 256)</text>
  <text x="885" y="232" class="small">局面特征 board_feature</text>
  <text x="955" y="266" class="shape-label">[B, 256]</text>

  <text x="70" y="350" class="section">动作分支 move_encoder</text>
  <rect x="50" y="375" width="230" height="92" class="move"/>
  <text x="70" y="404" class="box-title">move_features</text>
  <text x="70" y="429" class="box-text">输入形状：[B, M, 45]</text>
  <text x="70" y="452" class="small">M 为候选合法动作数</text>

  <line x1="280" y1="421" x2="340" y2="421" class="arrow"/>
  <rect x="340" y="365" width="250" height="112" class="move"/>
  <text x="360" y="397" class="box-title">MLP 动作编码器</text>
  <text x="360" y="425" class="box-text">Linear(45, 128) + ReLU</text>
  <text x="360" y="449" class="box-text">Linear(128, 128) + ReLU</text>
  <text x="360" y="470" class="small">输出动作嵌入 move_embedding</text>
  <text x="435" y="498" class="shape-label">[B, M, 128]</text>

  <line x1="1075" y1="201" x2="1125" y2="201" class="arrow"/>
  <line x1="590" y1="421" x2="760" y2="421" class="arrow"/>

  <rect x="760" y="346" width="250" height="150" class="head"/>
  <text x="780" y="378" class="box-title">score_head</text>
  <text x="780" y="406" class="box-text">拼接 board_feature + move_embedding</text>
  <text x="780" y="430" class="box-text">Linear(256+128, 128) + ReLU</text>
  <text x="780" y="454" class="box-text">Linear(128, 1)</text>
  <text x="780" y="478" class="small">对每个候选动作输出一个分数</text>

  <path d="M970 247 C970 300, 885 300, 885 346" class="arrow"/>
  <text x="995" y="305" class="small">board_feature 广播到每个候选动作</text>

  <line x1="1010" y1="421" x2="1075" y2="421" class="arrow"/>
  <rect x="1075" y="375" width="205" height="92" class="output"/>
  <text x="1095" y="404" class="box-title">policy_logits</text>
  <text x="1095" y="429" class="box-text">输出形状：[B, M]</text>
  <text x="1095" y="452" class="small">用于选择候选动作</text>

  <rect x="1125" y="155" width="155" height="92" class="value"/>
  <text x="1145" y="184" class="box-title">value_head</text>
  <text x="1145" y="209" class="box-text">Linear(256,128)</text>
  <text x="1145" y="232" class="box-text">Linear(128,1)+Tanh</text>

  <line x1="1202" y1="247" x2="1202" y2="305" class="arrow"/>
  <rect x="1100" y="305" width="205" height="86" class="output"/>
  <text x="1120" y="334" class="box-title">value</text>
  <text x="1120" y="359" class="box-text">输出形状：[B]</text>
  <text x="1120" y="381" class="small">范围约为 [-1, 1]</text>

  <rect x="50" y="565" width="360" height="110" class="note"/>
  <text x="70" y="596" class="box-title">move_mask</text>
  <text x="70" y="624" class="box-text">形状：[B, M]</text>
  <text x="70" y="648" class="box-text">真实候选动作为 1，padding 动作为 0。</text>
  <text x="70" y="670" class="small">padding 动作的 logit 被置为 -1e9。</text>

  <path d="M410 620 C700 620, 1020 560, 1168 468" class="dash"/>

  <rect x="475" y="555" width="785" height="130" class="note"/>
  <text x="500" y="586" class="box-title">当前默认 YAML 参数</text>
  <text x="500" y="615" class="box-text">board_channels=6, board_size=10, conv_channels=64, conv_layers=3, conv_kernel_size=3, conv_padding=1</text>
  <text x="500" y="642" class="box-text">board_feature_dim=256, move_feature_dim=45, move_embedding_dim=128, hidden_dim=128</text>
  <text x="500" y="668" class="small">配置文件：trainer/config/model.yaml</text>
</svg>
