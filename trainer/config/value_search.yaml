# ValueSearchAgent 参数。
# 它用 checkpoint 的 value_head 对模拟后的局面估值，适合作为神经网络辅助浅层搜索。

# 搜索半回合深度。1 表示只枚举当前所有合法动作并评估走后局面。
# 2 会继续考虑对手一手回应，速度会明显变慢。
search_depth: 1

# 每个搜索节点只保留 policy score 最高的前 K 个动作；0 表示不裁剪。
# depth=1 时通常建议 0；depth>=2 时可设为 4 或 6 控制耗时。
top_k: 0

# 直接搜索到胜负终局时使用的价值幅度，应与 value_head 的 [-1,1] 输出尺度一致。
terminal_value: 1
