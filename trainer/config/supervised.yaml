# 监督学习训练参数。

# 训练轮数；1 个 epoch 表示完整遍历一次训练集。
epochs: 5

# 每个 batch 的样本数；数值越大通常越稳定，但占用更多内存。
batch_size: 64

# Adam 优化器学习率；过大会震荡，过小会训练很慢。
learning_rate: 0.001

# value loss 在总损失中的权重。
# policy loss 负责模仿老师走法，value loss 负责学习局面胜负倾向。
value_loss_weight: 0.25

# 验证集比例；0.1 表示 10% 数据用于验证，不参与参数更新。
validation_split: 0.1

# 随机种子；影响训练/验证划分、shuffle 和初始参数。
seed: 4

# 是否打乱训练样本；1 表示打乱，0 表示不打乱。
shuffle: 1

# 每隔多少个 batch 打印一次训练日志。
log_interval: 20

# 每隔多少个 epoch 向 CSV 写入一行训练记录。
# 长时间训练时可以调大，例如 5 或 10，避免 CSV 过长；最后一个 epoch 一定会写入。
csv_log_interval_epochs: 1

# DataLoader 子进程数；当前数据量不大，CPU 环境用 0 最稳妥。
num_workers: 0
