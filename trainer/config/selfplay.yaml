# Selfplay 对局数据生成参数。

# 黑方 agent，可选 random、greedy、material、alphabeta、supervised、valuesearch。
black: alphabeta

# 白方 agent，可选 random、greedy、material、alphabeta、supervised、valuesearch。
white: alphabeta

# 生成局数。
games: 100

# 每局最大半回合数；达到上限仍未结束时，该局样本 value_target 记为 0。
max_plies: 500

# 输出 JSONL 文件路径。
output: data/selfplay.jsonl

# 每隔多少局打印一次进度。
log_interval: 1

# 随机种子；AlphaBeta 在并列候选动作随机挑选时会用到。
seed: 1

# MaterialAgent 参数文件；不需要时写 none。
material_config: none

# AlphaBetaAgent 参数文件；不需要时写 none，表示使用默认 alphabeta.yaml。
alphabeta_config: none

# ValueSearchAgent 参数文件；不需要时写 none，表示使用默认 value_search.yaml。
value_search_config: none

# 黑方 SupervisedAgent/ValueSearchAgent checkpoint；仅 black 为 supervised/valuesearch 时需要。
black_checkpoint: none

# 白方 SupervisedAgent/ValueSearchAgent checkpoint；仅 white 为 supervised/valuesearch 时需要。
white_checkpoint: none

# SupervisedAgent/ValueSearchAgent 设备；none 表示自动选择，CPU 可写 cpu，GPU 可写 cuda。
device: none

# 是否追加写入 output；1 表示追加，0 表示覆盖/新建。
append: 0

# 如果 output 已存在，是否自动生成 _001/_002 新文件名避免覆盖。
# 默认开启，适合批量生成数据；如果 append 为 1，这里必须为 0。
auto_output_name: 1
