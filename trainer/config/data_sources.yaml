# 监督训练数据源权重配置示例。
# 当前解析器支持 source_N_path / source_N_policy_weight / source_N_value_weight / source_N_name。
# 如果只用旧命令 `trainer/train_supervised.py data`，等价于所有样本 policy_weight=1、value_weight=1。

# AlphaBeta 老师数据：建议保留完整 policy 权重，因为它目前仍强于监督模型。
source_1_path: data/alphabeta_data
source_1_policy_weight: 1.0
source_1_value_weight: 1.0
source_1_name: alphabeta

