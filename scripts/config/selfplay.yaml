# Selfplay 对局数据生成参数。

# 黑方 agent，可选 random、material、alphabeta、alphabeta_plus、supervised。
black: alphabeta

# 白方 agent，可选 random、material、alphabeta、alphabeta_plus、supervised。
white: alphabeta

# 生成局数。
games: 100

# 每局最大半回合数；达到上限仍未结束时，该局样本 value_target 记为 0。
max_plies: 500

# 输出 JSONL 文件路径。
output: data/selfplay.jsonl

# 每隔多少局打印一次进度。
log_interval: 1

# 随机种子。
seed: 1

# 开局随机走子数；Agent 接手前先随机走 N 步，产生多样化的起手局面。
# AlphaBeta 等确定性 Agent 必须设置此项（推荐 4-8），否则每局棋谱完全相同。
opening_random_plies: 6

# MaterialAgent 参数文件；不需要时写 none。
material_config: none

# AlphaBetaAgent 参数文件；不需要时写 none。
alphabeta_config: none

# 黑方 supervised checkpoint。
black_checkpoint: none

# 白方 supervised checkpoint。
white_checkpoint: none

# SupervisedAgent 推理设备；none 表示自动选择。
device: none

# 是否追加写入 output；1 表示追加，0 表示覆盖/新建。
append: 0

# output 已存在时自动生成 _001/_002 新文件名；append=1 时必须为 0。
auto_output_name: 1
