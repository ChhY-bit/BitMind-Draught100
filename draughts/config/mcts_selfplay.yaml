# ============================================================================
# MCTS 搜索超参数 — 自博弈生成训练数据用
#
# 追求对局多样性：开启 Dirichlet 噪声 + 带温度采样。
# 评测 / 实战 / GUI 请使用 mcts.yaml。
# ============================================================================

# num_simulations — 每步棋执行多少次 MCTS 模拟。
# 自博弈需要生成大量对局，sims 过高会导致数据产出太慢。
# v2 网络（15M）单次推理约 1.5ms，400 sims 是对局质量与产量的平衡点。
#   200 → 极速产数据
#   400 → 均衡（推荐，配合 FP16+compile 可接近 v1 的 800 sims 产出速度）
#   800 → 高质量但慢（v1 默认值）
num_simulations: 400

# c_puct — 探索系数。
# PUCT = Q(s,a) + c_puct × P(s,a) × √N(s) / (1 + N(s,a))
c_puct: 1.5

# temperature — 走子选择温度。
# 自博弈使用 1.0，按 visit count 分布比例采样，增加对局多样性。
#   0.0 → 确定性（评测用，自博弈不推荐）
#   1.0 → 按 visit 分布采样（推荐）
#   >1.0 → 更平均、更随机
temperature: 1.0

# dirichlet_alpha — Dirichlet 噪声浓度。
# α 越小 → 噪声越"尖"（集中在少数走法）。
# α 越大 → 噪声越"平"（均匀撒在所有走法）。
# 国际跳棋分支因子约 8-10，推荐 0.2 ~ 0.5。
dirichlet_alpha: 0.3

# dirichlet_epsilon — 噪声混合比例。
# P_root = (1 - ε) × P_network + ε × Dirichlet(α)
# 0.25 = AlphaZero 标准值。
dirichlet_epsilon: 0.25

# add_noise — 自博弈时必须开启。
# 在根节点 prior 中混入 Dirichlet 噪声，强制 MCTS 探索网络不看好的分支，
# 产生多样化的训练数据。
add_noise: true

# batch_size — MCTS 批量叶子推理（GPU 批处理加速，数据产出提效利器）。
#
#   开启/关闭：1 = 关闭（顺序搜索），≥2 = 开启（批量推理）。
#
#   内部机制：
#     每 batch_size 条模拟路径共享一次 GPU 推理。批次内通过"虚拟损失"
#     （virtual loss = -1）临时惩罚已被其他路径选中的边，促使批次内的
#     不同路径探索不同分支。批次结束后虚拟损失清零，不干扰后续搜索。
#
#   参数选择（GPU 场景）：
#     1（默认）→ 关闭。每 sim 单独推理，兼容旧行为。
#     4       → 推荐。GPU 调用降为 1/4，搜索质量几乎无损。
#     8       → 激进。适配 num_simulations ≥ 800，分散更明显。
#
#   CPU 场景：建议保持 1。CPU 推理无 GPU kernel launch 瓶颈，
#             批量 SIMD 加速有限，虚拟损失分散反而得不偿失。
#
#   与 run/ 脚本的关系：完全兼容。run/selfplay_cuda*.sh 按进程级并行
#     → 每个进程内再按 batch_size 批量推理 → 两级并行叠加，效果最佳。
batch_size: 1
