# ============================================================================
# MCTS 搜索超参数配置
#
# 每个参数的含义、影响以及调参方向，见下方注释。
# 命令行可通过 --mcts-config <path> 指定自定义配置。
# ============================================================================

# num_simulations — 每步棋执行多少次 MCTS 模拟（单次模拟 = selection →
# expansion → evaluation → backprop）。
#
# 越多 → 搜索越充分、棋力越强，但耗时线性增长。
# 国际跳棋分支因子约 8-10，比围棋（250+）小一个数量级，通常不需要 800。
#   200 → 快速评测
#   400 → 均衡
#   800 → 充分搜索
num_simulations: 1200

# c_puct — 探索系数，控制在 PUCT 公式中 "先验概率" 相对于 "已访问价值"
# 的影响力。
#
# PUCT = Q(s,a) + c_puct × P(s,a) × √N(s) / (1 + N(s,a))
#           ↑ 利用      ↑ 探索（由网络先验引导）
#
# 值越大 → 更信任网络给出的先验分布，更愿意探索未访问的走法。
# 值越小 → 更倾向反复选择已知回报高的走法。
# 常用范围：1.0 ~ 4.0，1.5 是较保守的起点。
c_puct: 1.5

# temperature — 从 visit count 分布中选择最终走法时的温度。
#
# 作用层面：对局层 / 决策层（MCTS 外部）—— 800 次模拟全部完成后才介入，
# 仅影响"最终选哪步棋"，不干预 MCTS 内部的搜索过程。
#
# 与 Dirichlet 噪声的层级分工：
#   - Dirichlet 噪声：思考层（MCTS 内部）—— 干预根节点 prior，影响搜索方向。
#   - temperature：  决策层（MCTS 外部）—— 干预最终走法选择，影响对局多样性。
#   两者都在制造多样性，但作用的维度不同。
#
#   0.0（默认）→ 确定性选择，总是选访问次数最多的走法（评测/实战用）。
#   1.0        → 按 visit count 分布比例采样（自博弈用，增加对局多样性）。
#   > 1.0      → 更平均，走法选择更随机。
#   0 ~ 1      → 更尖锐，更倾向选 visit count 高的走法。
#
# 评测/实战时务必设为 0.0，自博弈建议设为 1.0。与 add_noise 一样，温度
# 也是"自博弈开启、实战关闭"的参数。
temperature: 0.0

# dirichlet_alpha — Dirichlet 噪声的浓度参数（仅自博弈生效，由 add_noise 控制）。
#
# 作用层面：思考层（MCTS 内部）—— 在搜索开始前，干预根节点的网络先验概率，
# 让 MCTS 不要过早"锁定"少数高分走法，给其他分支也留一些被探索的机会。
# 与 temperature 的区别：Dirichlet 影响"怎么搜"，temperature 影响"怎么选"。
#
# 在根节点的网络先验概率上叠加 Dirichlet 噪声，防止 MCTS 过早"锁定"少数
# 高分走法，遗漏其他有潜力的分支。这对 Phase 3 自博弈的数据多样性至关重要。
#
# α 越小 → 噪声越"尖"（集中在少数走法上）。
# α 越大 → 噪声越"平"（均匀撒在所有走法上）。
# 棋盘分支因子越大，α 通常越小。国际跳棋推荐 0.2 ~ 0.5。
#
# 注意：由 add_noise 配置项控制是否启用，评测/实战时应设为 false。
dirichlet_alpha: 0.3

# dirichlet_epsilon — 噪声混合比例。
#
# P_root = (1 - ε) × P_network + ε × Dirichlet(α)
#
# 0.0  → 不加噪声，完全信任网络先验。
# 0.25 → 25% 来自噪声，75% 来自网络（AlphaZero 标准值）。
# 1.0  → 完全用噪声替换网络先验（几乎等同于纯 MCTS）。
dirichlet_epsilon: 0.25

# add_noise — 是否在根节点添加 Dirichlet 噪声（仅自博弈生效）。
#
# 自博弈时开启，增加对局多样性；评测/实战时关闭，追求最强走法。
#
# 与 dirichlet_epsilon 的关系（等价性）：
#   add_noise = false  →  不采样 Dirichlet，零开销，等价于 ε = 0.0。
#   add_noise = true, ε = 0.0  →  采样但混合权重为 0，效果等同不加噪声。
#   两种方式都可以关闭噪声，推荐直接设 add_noise = false 更直观。
#
# 为什么实战不加入噪声？
#   噪声会刻意引导 MCTS 探索网络不看好的走法。自博弈时需要这种"反事实"
#   探索来产生多样化的训练数据，但实战中就是纯粹降低棋力。这和 temperature
#   的逻辑一致：自博弈 temp=1.0 增加多样性，实战 temp=0.0 选最强走法。
add_noise: true
