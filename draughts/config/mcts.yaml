# ============================================================================
# MCTS 搜索超参数 — 评测 / 实战 / GUI 用
#
# 追求最强棋力：关闭探索噪声、确定性选子。
# 自博弈请使用 mcts_selfplay.yaml。
# ============================================================================

# num_simulations — 每步棋执行多少次 MCTS 模拟。
# 越多 → 搜索越充分、棋力越强，但耗时线性增长。
#   200 → 快速评测
#   400 → 均衡
#   800 → 充分搜索
#   1200 → 高强度
num_simulations: 1200

# c_puct — 探索系数。
# PUCT = Q(s,a) + c_puct × P(s,a) × √N(s) / (1 + N(s,a))
# 常用范围：1.0 ~ 4.0，1.5 是较保守的起点。
c_puct: 1.5

# temperature — 走子选择温度。
# 评测/实战固定为 0.0（确定性选访问次数最多的走法）。
temperature: 0.0

# Dirichlet 噪声参数（评测/实战关闭）。
# 以下参数保留但不生效，因为 add_noise = false。
dirichlet_alpha: 0.3
dirichlet_epsilon: 0.25

# add_noise — 评测/实战必须关闭。
# 不干扰根节点 prior，MCTS 纯粹搜索最优解。
add_noise: false

# batch_size — MCTS 批量叶子推理（GPU 批处理加速）。
#
#   控制机制：
#     每 batch_size 条模拟路径共享一次 GPU 推理（而非每条路径单独推理）。
#     内部使用"虚拟损失"（virtual loss = -1）在批次内分散搜索路径，
#     batch 结束后虚拟损失清零，不残留到后续批次。
#
#   参数选择：
#     1（默认）→ 关闭批量推理。每 sim 单独推理，行为与 v1.0 完全相同。
#     4       → 推荐起点。GPU 推理调用量降为 1/4，搜索质量几乎无损失。
#     8       → 更激进。适用大 sims 数（≥800），虚拟损失分散更明显。
#     >8      → 不推荐。虚拟损失过度分散可能降低搜索效率，收益递减。
#
#   适用场景：
#     评测/实战：建议保持 1（追求单步最强棋力，不引入任何分散）。
#     自博弈：  建议 4-8（牺牲微量精度换数据产出速度，性价比极高）。
#
#   CPU vs GPU：
#     GPU：显著受益。batch 减少 kernel launch 开销，提升 GPU 占用率。
#     CPU：收益有限。CPU 推理无 kernel launch 瓶颈，batch 带来的 SIMD
#           加速远不如 GPU 明显，虚拟损失分散反而可能降低搜索效率。
#           建议 CPU 上保持 batch_size=1。
batch_size: 1
