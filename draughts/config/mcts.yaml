# ============================================================================
# MCTS 搜索超参数 — 评测 / 实战 / GUI 用
#
# 追求最强棋力：关闭探索噪声、确定性选子。
# 自博弈请使用 mcts_selfplay.yaml。
# ============================================================================

# num_simulations — 每步棋执行多少次 MCTS 模拟。
# 越多 → 搜索越充分、棋力越强，但耗时线性增长。
#   200 → 快速评测
#   400 → 均衡
#   800 → 充分搜索
#   1200 → 高强度
num_simulations: 1200

# c_puct — 探索系数。
# PUCT = Q(s,a) + c_puct × P(s,a) × √N(s) / (1 + N(s,a))
# 常用范围：1.0 ~ 4.0，1.5 是较保守的起点。
c_puct: 1.5

# temperature — 走子选择温度。
# 评测/实战固定为 0.0（确定性选访问次数最多的走法）。
temperature: 0.0

# Dirichlet 噪声参数（评测/实战关闭）。
# 以下参数保留但不生效，因为 add_noise = false。
dirichlet_alpha: 0.3
dirichlet_epsilon: 0.25

# add_noise — 评测/实战必须关闭。
# 不干扰根节点 prior，MCTS 纯粹搜索最优解。
add_noise: false
